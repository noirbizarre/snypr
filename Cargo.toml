[package]
name = "snypr"
edition = "2024"
version = "0.3.0"
description = "A GTK4-based screenshot, annotation, and live-drawing tool for Hyprland"
readme = "README.md"
repository = "https://github.com/noirbizarre/snypr"
license = "MIT"

# Snypr is a Wayland desktop application, distributed as source: it links
# GTK4 and gtk4-layer-shell dynamically and installs desktop entries, icons and
# a manpage that `cargo install` would not place. Publishing to crates.io would
# advertise an install path that produces a half-installed application. Setting
# this makes `cargo publish` refuse outright, rather than leaving the decision
# to depend on a registry token happening to be absent.
publish = false

[[bin]]
name = "snypr"
path = "src/main.rs"

[features]
default = ["ui", "tray", "notify"]
ui = [
  "dep:gtk4",
  "dep:gdk4",
  "dep:gdk4-wayland",
  "dep:gsk4",
  "dep:gtk4-layer-shell",
  "dep:glib",
  "dep:cairo-rs",
  "dep:pango",
  # Build-time only: compiles the icon gresource that `ui::install_icon_resources`
  # embeds. Optional so a `--no-default-features` build needs no system glib at all.
  "dep:glib-build-tools",
]
tray = ["ui", "dep:ksni"]
# Emit a desktop notification when snypr exits with an error. Useful when launched from a
# Hyprland keybind where stderr is detached.
notify = ["dep:notify-rust"]
# Enables `tests/wayland.rs`, which drives the real zwlr_screencopy path against a live
# compositor. The tests skip themselves when the protocol is unavailable (CI's headless
# Weston does not implement it); set SNYPR_REQUIRE_WAYLAND_CAPTURE=1 to make that a failure.
integration-wayland = []

[dependencies]
# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Async runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "fs",
  "io-util",
  "time",
  "signal",
] }
async-channel = "2"
async-trait = "0.1"

# Config / paths / serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }

# Image
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
bytemuck = "1"

# Wayland (capture)
# Registry / output / shm plumbing for the capture backend only — no seat or keyboard
# handling, so the default `xkbcommon` and `calloop` features are dead weight. Dropping
# them also drops a libxkbcommon system dependency from the toolkit-free build.
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"

# Clipboard
wl-clipboard-rs = "0.9"
# Used by the detached clipboard child (fork/setsid/dup2) so one-shot CLI invocations can
# serve the wayland selection after the parent exits. Both crates are already in the
# dependency graph via wl-clipboard-rs / gtk; declaring them directly keeps the unsafe
# fork code self-documenting.
libc = "0.2"
os_pipe = "1"

# Window-manager IPC (Hyprland, Sway, Niri): implemented directly against each compositor's
# own socket (see src/wm/) to avoid the upstream `hyprland` crate's hard-coded /tmp/hypr path
# and panic-on-error semantics (and, for Niri, to avoid the `niri-ipc` dependency for a handful
# of hand-rolled request/response types), and to keep the toolkit-free build free of extra
# dependencies. A fourth backend, src/wm/foreign_toplevel.rs, covers any other wlroots
# compositor (river, labwc, …) that advertises the generic
# `zwlr_foreign_toplevel_manager_v1` protocol instead — reusing the same Wayland deps as the
# capture backend above, no extra dependency either.

# GTK stack (optional via `ui` feature)
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
gdk4 = { version = "0.11", optional = true }
gdk4-wayland = { version = "0.11", optional = true }
gsk4 = { version = "0.11", optional = true }
gtk4-layer-shell = { version = "0.8", optional = true }
glib = { version = "0.22", optional = true }
cairo-rs = { version = "0.22", optional = true }
pango = { version = "0.22", optional = true }

# Tray (optional)
ksni = { version = "0.3", optional = true }

# Desktop notifications (optional via `notify` feature)
notify-rust = { version = "4", optional = true }

# Internationalization (Fluent + embedded catalogs)
i18n-embed = { version = "0.16", features = [
  "fluent-system",
  "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"
fluent = "0.17"
unic-langid = "0.9"
once_cell = "1"

[build-dependencies]
# Optional, enabled by `ui`: it pulls glib-sys, and a toolkit-free build must not
# require system glib to compile.
glib-build-tools = { version = "0.22", optional = true }

[dev-dependencies]
rstest = "0.26"
pretty_assertions = "1"
tempfile = "3"

# Image/compression crates dominate end-to-end screenshot time. Building them at -O3 even in
# dev profile drops PNG encode for a 5760x3360 capture from ~18 s to well under 1 s.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
