<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- GitHub social preview: 1280x640, generated by `mise run social`.
       The logo is referenced rather than duplicated, so the two cannot drift.
       This file is only ever rasterized locally, never served, so the nested
       SVG reference is safe here in a way it would not be in a served asset.

       The canvas lives here rather than being passed as resvg flags because
       resvg scales to fit rather than padding: forcing width 1280 and height
       640 on a 1900x670 source yields the wrong size, not GitHub's required
       1280x640.

       The background is opaque because transparency renders black on most
       social cards, which would swallow the dark navy in the mark. No <text>
       element is needed — logo.svg already carries the wordmark, as paths, so
       rendering does not depend on an installed font. -->
  <rect width="1280" height="640" fill="#ffffff" />
  <image href="logo.svg" x="115" y="145" width="1050" height="370" />
</svg>
