# typos (https://github.com/crate-ci/typos) configuration.
#
# `typos` is English-only: it has no notion of the locale a file is written in,
# so every French word that happens to look like an English typo is reported.
# `git-cliff` runs `typos --write-changes` over commit messages at release time
# (see `cliff.toml`), which makes a clean run load-bearing rather than advisory.

[files]
# The changelog is generated from commit messages that are already immutable —
# a typo in a shipped commit subject cannot be fixed by editing this file.
extend-exclude = ["CHANGELOG.md"]

[default.extend-words]
# French UI catalog and the assertions that pin its strings.
espace = "espace"       # "espace insécable" — non-breaking space
sur = "sur"             # "cliquez sur" — click on
presse = "presse"       # "presse-papiers" — clipboard
visibles = "visibles"   # plural of "visible"
invalide = "invalide"   # "invalid"

# Domain vocabulary that `typos` mistakes for misspellings.
unparseable = "unparseable"
unparented = "unparented"
PN = "PN"               # "PNG" truncated by the tokenizer in a prose comment
