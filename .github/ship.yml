# yaml-language-server: $schema=https://noirbizarre.github.io/gh-ship/schema/config/v1.json
# gh-ship configuration
# Docs: https://noirbizarre.github.io/gh-ship/configuration/
#
# gh-ship orchestrates the release; the version bump and the changelog are
# produced by the `prepare-release` workflow using git-cliff. If this file or
# the workflows it names stop satisfying the contract, `gh ship validate` fails
# in CI.

version: 1

release_branch: release/next

workflows:
  prepare: prepare-release
  publish: publish-release

pull_request:
  # Conventional on purpose. The repository squashes with
  # `squash_merge_commit_title=PR_TITLE`, so this string becomes the subject of
  # the commit landing on main. `chore(release):` is what cliff.toml skips
  # explicitly; anything else would only be kept out of the changelog by
  # `filter_unconventional`, which is an accident rather than a guarantee, and
  # would fail the Commitizen convention the pre-push hook enforces.
  title: "chore(release): {{ version }}"
  header: |
    This PR prepares the next release of Snypr.

    The version bump and changelog were produced by the `prepare-release`
    workflow. Review the changelog, then merge — 🚢 Ship takes it from there.
  footer: |
    ---
    Generated automatically by [gh-ship](https://github.com/noirbizarre/gh-ship).
  labels: [release]

release:
  # Draft first, so the publish workflow can attach the source tarball before
  # anyone watching the repository is notified. A release announced before its
  # assets exist is a release nobody can download.
  draft: true
