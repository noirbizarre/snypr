name: 👮 CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  test:
    name: 🧪 Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        uses: ./.github/actions/install-gtk4-layer-shell

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci --all-features
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-gtk4-layer-shell
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -Dclippy::all

  # gh-ship releases HyprSnap. Its configuration and workflows must satisfy the
  # contract gh-ship enforces, or the release breaks at the worst moment.
  ship:
    name: 🚢 Ship setup
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship

      - name: Validate the release setup
        run: gh ship validate
