name: 👮 CI
on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to tell us, and a job wedged on a slow apt
# mirror will otherwise sit on a runner until the 6h default timeout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # The toolkit-free build. It needs no compositor and no GTK, and it is the only
  # thing standing between us and `--no-default-features` silently rotting again
  # (it did: daemon.rs referenced crate::ui unconditionally for a while).
  # Uploaded under the `core` flag.
  test-core:
    name: 🧪 Tests (core, no GTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci-core --no-default-features --features notify
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: core
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci-core
          flags: core
          report_type: test_results

  # The full build, under a headless compositor. Superset of `test-core`; the only
  # job that covers src/ui/. Uploaded under the `gtk` flag.
  test-gtk:
    name: 🧪 Tests (GTK, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Prefer the official Ubuntu mirrors
        uses: ./.github/actions/apt-mirrors

      - name: Install system dependencies
        uses: ./.github/actions/install-gtk4-layer-shell

      # Widget-level tests need a GdkDisplay. Without this they skip themselves,
      # which would quietly hide every UI regression. The action also exports
      # SNYPR_REQUIRE_GTK=1, turning a skip into a hard failure.
      - name: Start a headless compositor
        uses: ./.github/actions/headless-compositor

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci --all-features
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: gtk
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          flags: gtk
          report_type: test_results

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Prefer the official Ubuntu mirrors
        uses: ./.github/actions/apt-mirrors
      - name: Install system dependencies
        uses: ./.github/actions/install-gtk4-layer-shell
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -Dclippy::all
      # The no-`ui` build has its own set of dead code and unused imports that
      # `--all-features` cannot see.
      - name: cargo clippy (core)
        run: cargo clippy --all-targets --no-default-features --features notify -- -Dclippy::all

  # gh-ship releases Snypr. Its configuration and workflows must satisfy the
  # contract gh-ship enforces, or the release breaks at the worst moment.
  ship:
    name: 🚢 Ship setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship

      - name: Validate the release setup
        run: gh ship validate
