name: 📦 Publish Release

# Dispatched by `gh ship release` on the tag it just created, which is also how
# gh-ship correlates the run it started.
# See https://noirbizarre.github.io/gh-ship/workflows/
run-name: 📦 Publish Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Snypr links GTK4 and gtk4-layer-shell dynamically, so a prebuilt binary is
  # only valid on a distribution whose GTK4 stack matches the build machine.
  # We therefore build inside Arch and support that binary on Arch only — it is
  # what `snypr-bin` consumes so AUR users never compile. Everyone else gets the
  # source tarball built by `publish`.
  binary:
    name: 📦 Binary (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # `base-devel` gives us the toolchain; the rest is what the -sys crates
      # resolve through pkg-config, mirroring the `snypr-bin` runtime deps.
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git rust gtk4 gtk4-layer-shell wayland pkgconf

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # `--locked` so the binary is built from the exact dependency graph that
      # CI tested, matching the tracked Cargo.lock.
      - name: Build
        run: cargo build --release --locked

      # The layout mirrors the packager table in the README, rooted at the
      # tarball prefix, so `snypr-bin` only has to `cp -a` it into `$pkgdir/usr`.
      - name: Stage the tarball
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          stage="snypr-${TAG}-x86_64-unknown-linux-gnu"
          install -Dm755 target/release/snypr "$stage/bin/snypr"
          strip "$stage/bin/snypr"
          install -Dm644 -t "$stage/share/applications" data/applications/*.desktop
          for size in 16x16 32x32 48x48 64x64 128x128 256x256 512x512; do
            install -Dm644 \
              "data/icons/hicolor/$size/apps/noirbizar.re.Snypr.png" \
              "$stage/share/icons/hicolor/$size/apps/noirbizar.re.Snypr.png"
          done
          install -Dm644 \
            data/icons/hicolor/scalable/apps/noirbizar.re.Snypr.svg \
            "$stage/share/icons/hicolor/scalable/apps/noirbizar.re.Snypr.svg"
          install -Dm644 docs/man/snypr.1 "$stage/share/man/man1/snypr.1"
          install -Dm644 LICENSE "$stage/LICENSE"
          install -Dm644 README.md "$stage/README.md"
          mkdir -p dist
          tar -czf "dist/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    needs: [binary]

    # This is the deployment. Declaring a `url:` registers it in the
    # repository's deployment list and links straight to what shipped.
    # The environment is `release` because that is where APP_CLIENT_ID and
    # APP_PRIVATE_KEY live.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

    steps:
      # An installation token, revoked when this job ends. It cannot live in
      # the job's `env:` — a step output is not resolvable there — so the one
      # `gh` step below sets it itself.
      # See https://noirbizarre.github.io/gh-ship/workflows/#using-a-github-app
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Build exactly what is being released, not a branch tip that
          # may have moved since. `git archive` needs the tag object, which a
          # shallow clone does not carry.
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # The source tarball stays the canonical artifact: it is what
      # `cargo install --git`, the `snypr`/`snypr-git` AUR packages and other
      # distribution packagers consume.
      - name: Build the source tarball
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="snypr-${TAG}/" \
            -o "dist/snypr-${TAG}.tar.gz" "$TAG"

      - name: Collect the prebuilt binary
        uses: actions/download-artifact@v8
        with:
          name: binary-x86_64
          path: dist

      - name: Checksums
        working-directory: dist
        # `--` so an asset whose name begins with a dash is treated as a
        # file rather than an option (shellcheck SC2035).
        run: sha256sum -- * > SHA256SUMS

      # The release already exists as a DRAFT: gh-ship created it before
      # dispatching this workflow, and will undraft it once we succeed.
      # That ordering is what lets assets land before anyone is notified.
      - name: Upload assets to the draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release upload "$TAG" dist/* --clobber
