[settings]
# Resolve tools through mise.lock and keep it updated. Without this, the
# lockfile is ignored and `latest` really means latest — including for
# git-cliff, whose version decides how the changelog reads.
lockfile = true

[tools]
prek = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# Release tooling: git-cliff derives the next version and writes CHANGELOG.md,
# and its commit preprocessor shells out to typos.
git-cliff = "latest"
typos = "latest"
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is
# absent, so without this a local run is NOT the CI run. Pinned to the aqua
# backend explicitly: the default resolution is an asdf plugin, which carries
# no lockfile URL and so cannot be installed in locked mode.
"aqua:koalaman/shellcheck" = "latest"

[tasks.default]
description = "Run fmt, lint, spell, build and test"
depends = ["fmt", "lint", "lint:actions", "spell", "build", "test"]

[tasks.test]
description = "Run tests with selectors"
raw_args = true
run = 'cargo nextest run'

[tasks.cover]
description = "Run tests with coverage"
# `--all-features` mirrors the CI invocation so local numbers match what
# Codecov gates on.
run = "cargo llvm-cov nextest --all-features"

[tasks.build]
description = "Build the binaries"
run = "cargo build"

[tasks.setup]
description = "Install the binaries"
run = "cargo install --path . --force"

[tasks.snypr]
description = "Run the application"
raw_args = true
run = 'cargo run --bin snypr --'

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -Dclippy::all"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Two suppressions, both for tools lagging behind documented behaviour:
#
# 1. actionlint does not yet know `environment.deployment`, a documented,
#    supported key:
#    https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
# 2. actionlint's bundled metadata for actions/create-github-app-token@v3 is
#    stale: upstream `client-id` is the current input and `app-id` is
#    deprecated, which is the opposite of what actionlint asserts.
#
# Every other unexpected key or unknown input is still caught. Drop each
# -ignore once actionlint refreshes.
run = """
actionlint \
  -ignore 'unexpected key "deployment" for "environment" section' \
  -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"' \
  -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@v3"' \
  .github/workflows/*.yml
"""

[tasks.spell]
description = "Check spelling"
run = "typos"

# --- Release ----------------------------------------------------------------
# Releases are orchestrated by gh-ship: push to main opens the Release PR,
# merging it tags and publishes. These tasks are for previewing that locally;
# maintainers never tag by hand.

[tasks.changelog]
description = "Preview the changelog for the next release"
run = "git cliff --bump -o CHANGELOG.md"

[tasks.version]
description = "Show the version the next release would carry"
run = "git cliff --bumped-version"

[tasks.dogfood]
description = "Validate this repository's own gh-ship release setup"
run = "gh ship validate"

# --- Artwork ----------------------------------------------------------------
#
# Neither task joins `default`: they rewrite committed binaries, so a routine
# run would dirty the working tree every time. Run them when the artwork
# changes — `social` too after editing logo.svg, since the preview embeds it.
#
# resvg is declared per-task rather than in `[tools]`: CI runs `mise install`,
# which installs `[tools]` only, and resvg has no prebuilt binstall artifact, so
# a global entry would make every CI job compile it from source. It is pure
# Rust, needs no system libraries, and renders identically on every platform.

[tasks.icons]
description = "Rasterize docs/images/icon.svg into the hicolor icon theme"
tools = { "cargo:resvg" = "latest" }
# These are the exact paths the .desktop files, the packager table in README.md
# and all three PKGBUILDs install — and src/ui/tray.rs `include_bytes!`s the
# 64x64 one, so the tray icon follows along.
#
# 48 is in the list because it is the canonical application icon size in the
# freedesktop icon theme specification, and consumers that look for one fixed
# size overwhelmingly look for that one.
#
# The scalable SVG is a copy rather than an install straight from docs/images/,
# so `data/icons/hicolor/` stays the single tree every installer reads. It is a
# generated artifact like the PNGs, so the two cannot drift.
run = """
for size in 16 32 48 64 128 256 512; do
  out="data/icons/hicolor/${size}x${size}/apps/noirbizar.re.Snypr.png"
  mkdir -p "$(dirname "$out")"
  resvg --width "$size" --height "$size" docs/images/icon.svg "$out"
  echo "$out"
done

svg="data/icons/hicolor/scalable/apps/noirbizar.re.Snypr.svg"
mkdir -p "$(dirname "$svg")"
cp docs/images/icon.svg "$svg"
echo "$svg"
"""

[tasks.social]
description = "Render the GitHub social preview image"
tools = { "cargo:resvg" = "latest" }
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under: Settings -> General -> Social preview.
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
